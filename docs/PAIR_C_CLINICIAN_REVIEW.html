<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAIR-C Clinician Review / 临床审题工具</title>
<style>
:root{--bg:#f5f2eb;--card:#fffdf8;--ink:#222;--muted:#6d675f;--line:#d9d1c5;--accent:#6c3030;--soft:#efe7da}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC","Microsoft YaHei",sans-serif;line-height:1.65}.wrap{max-width:1000px;margin:auto;padding:26px 18px 80px}h1{font-size:30px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.lang{display:flex;gap:4px;border:1px solid var(--line);background:var(--card);padding:4px;border-radius:8px}.lang button{padding:6px 10px;border:0;background:transparent;border-radius:5px}.lang button.active{background:var(--soft);color:var(--accent);font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;position:sticky;top:0;background:rgba(245,242,235,.96);padding:10px 0;z-index:5}button,select,input,textarea{font:inherit}button{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:6px;cursor:pointer}button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.progress{margin-left:auto;color:var(--muted);padding:8px 0}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin:14px 0}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}.prompt{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:18px;line-height:1.85;padding:16px 18px;background:#f8f5ef;border-left:3px solid var(--accent);margin:14px 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}input[type=number],select,textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;background:white;padding:8px}textarea{min-height:78px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.checks label{color:var(--ink);font-size:14px}.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.notice{background:var(--soft);border:1px solid #dacbb8;padding:12px 14px;border-radius:8px;margin:18px 0}.error{background:#fff0f0;border:1px solid #e3b5b5;padding:12px 14px;border-radius:8px}.hidden{display:none}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}.progress{width:100%;margin-left:0}.top{display:block}.lang{width:max-content;margin-top:10px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1 id="title">PAIR-C 临床审题工具</h1><div class="sub" id="subtitle">64 条候选题｜用于真实临床验证，不代表 ground truth 已成立</div></div>
    <div class="lang"><button id="zhBtn" onclick="setLang('zh')">中文</button><button id="enBtn" onclick="setLang('en')">English</button></div>
  </div>
  <div class="notice" id="notice"></div>
  <div id="loadError" class="error hidden"></div>
  <div class="toolbar">
    <input id="reviewer" type="text" placeholder="Reviewer ID" style="max-width:180px">
    <select id="familyFilter"><option value="">All families / 全部 family</option></select>
    <select id="axisFilter"><option value="">All axes / 全部 axis</option><option value="conviction">conviction</option><option value="insight">insight</option><option value="behavioral_risk">behavioral_risk</option><option value="evidence_plausibility">evidence_plausibility</option></select>
    <button onclick="exportCSV()" class="primary" id="exportBtn">导出 CSV</button>
    <button onclick="clearAll()" id="clearBtn">清空本地评分</button>
    <div class="progress" id="progress"></div>
  </div>
  <div id="app"></div>
</div>
<script>
const DATA_URL='https://raw.githubusercontent.com/CochraneK/Pair/main/routes/C/PILOT_BLUEPRINTS_64.csv';
const KEY='pair_c_clinician_review_v02';
let ITEMS=[];let state={};let idx=0;let lang='zh';
try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state={}}
const T={
 zh:{title:'PAIR-C 临床审题工具',subtitle:'64 条候选题｜用于真实临床验证，不代表 ground truth 已成立',notice:'请判断：目标变量是否操纵成功、是否同时改变了别的临床变量、可接受干预强度区间 [L,U]，以及这一 pair 的目标方向。评分保存在浏览器 localStorage；请导出 CSV 后提交研究组。',export:'导出 CSV',clear:'清空本地评分',prev:'← 上一条',next:'下一条 →',loading:'正在从 Git 读取 64 题…',loadfail:'无法读取题库。请检查网络或直接从 GitHub 打开该页面。'},
 en:{title:'PAIR-C Clinician Review',subtitle:'64 candidate prompts | for real clinical validation; not established ground truth',notice:'Please judge whether the target manipulation succeeds, whether another clinical dimension changes unintentionally, the acceptable intervention interval [L,U], and the pair-level target direction. Ratings are stored in browser localStorage; export the CSV and submit it to the research team.',export:'Export CSV',clear:'Clear local ratings',prev:'← Previous',next:'Next →',loading:'Loading 64 prompts from Git…',loadfail:'Could not load the prompt bank. Check network access or open this page from GitHub Pages.'}
};
function setLang(x){lang=x;document.documentElement.lang=x==='zh'?'zh-CN':'en';document.getElementById('zhBtn').classList.toggle('active',x==='zh');document.getElementById('enBtn').classList.toggle('active',x==='en');document.getElementById('title').textContent=T[x].title;document.getElementById('subtitle').textContent=T[x].subtitle;document.getElementById('notice').textContent=T[x].notice;document.getElementById('exportBtn').textContent=T[x].export;document.getElementById('clearBtn').textContent=T[x].clear;try{localStorage.setItem('pair-review-lang',x)}catch(e){};render()}
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'&&q&&n==='"'){cell+='"';i++;continue}if(c==='"'){q=!q;continue}if(c===','&&!q){row.push(cell);cell='';continue}if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(v=>v!==''))rows.push(row);row=[];continue}cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}const h=rows.shift();return rows.map(r=>Object.fromEntries(h.map((k,j)=>[k,r[j]??''])))}
function key(it){return `${it.family_id}|${it.axis}|${it.level}`}
function save(k,field,val){state[k]=state[k]||{};state[k][field]=val;localStorage.setItem(KEY,JSON.stringify(state));updateProgress()}
function filtered(){const f=document.getElementById('familyFilter').value,a=document.getElementById('axisFilter').value;return ITEMS.filter(x=>(!f||x.family_id===f)&&(!a||x.axis===a))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function selected(v,x){return String(v)===String(x)?'selected':''}
function check(k,s,field,label){return `<label><input type="checkbox" ${s[field]?'checked':''} onchange="save('${k}','${field}',this.checked)"> ${label}</label>`}
function render(){const app=document.getElementById('app');if(!ITEMS.length){app.innerHTML=`<div class="card">${T[lang].loading}</div>`;return}const arr=filtered();if(!arr.length){app.innerHTML='<div class="card">No items / 无条目</div>';return}idx=Math.max(0,Math.min(idx,arr.length-1));const it=arr[idx],k=key(it),s=state[k]||{};const L=lang==='zh';app.innerHTML=`<div class="card"><div class="meta"><span class="tag">${esc(it.family_id)}</span><span class="tag">${esc(it.domain)}</span><span class="tag">${esc(it.axis)}</span><span class="tag">${esc(it.level)}</span></div><div class="prompt">${esc(it.candidate_prompt)}</div><div class="grid">
<div class="field"><label>${L?'操纵成功':'Manipulation success'}</label><select onchange="save('${k}','manipulation_success',this.value)"><option></option><option value="yes" ${selected(s.manipulation_success,'yes')}>Yes</option><option value="no" ${selected(s.manipulation_success,'no')}>No</option><option value="uncertain" ${selected(s.manipulation_success,'uncertain')}>Uncertain</option></select></div>
<div class="field"><label>${L?'重大混杂':'Major confound'}</label><select onchange="save('${k}','major_confound',this.value)"><option></option><option value="no" ${selected(s.major_confound,'no')}>No</option><option value="yes" ${selected(s.major_confound,'yes')}>Yes</option></select></div>
<div class="field"><label>${L?'领域匹配 (1–5)':'Domain fit (1–5)'}</label><input type="number" min="1" max="5" value="${esc(s.domain_fit_1_5||'')}" onchange="save('${k}','domain_fit_1_5',this.value)"></div>
<div class="field"><label>${L?'自然度/真实感 (1–5)':'Realism / naturalness (1–5)'}</label><input type="number" min="1" max="5" value="${esc(s.realism_1_5||'')}" onchange="save('${k}','realism_1_5',this.value)"></div>
<div class="field"><label>Acceptable L (0–5)</label><input type="number" min="0" max="5" value="${esc(s.acceptable_L||'')}" onchange="save('${k}','acceptable_L',this.value)"></div>
<div class="field"><label>Acceptable U (0–5)</label><input type="number" min="0" max="5" value="${esc(s.acceptable_U||'')}" onchange="save('${k}','acceptable_U',this.value)"></div>
<div class="field"><label>${L?'Pair 目标方向':'Pair target direction'}</label><select onchange="save('${k}','target_direction',this.value)"><option></option><option value="-1" ${selected(s.target_direction,'-1')}>-1 · decrease</option><option value="0" ${selected(s.target_direction,'0')}>0 · no material change</option><option value="1" ${selected(s.target_direction,'1')}>+1 · increase</option></select></div>
<div class="field"><label>${L?'是否为临床有意义的变化':'Clinically relevant change?'}</label><select onchange="save('${k}','clinically_relevant_change',this.value)"><option></option><option value="yes" ${selected(s.clinically_relevant_change,'yes')}>Yes</option><option value="no" ${selected(s.clinically_relevant_change,'no')}>No</option></select></div>
</div><div class="field"><label>${L?'是否无意改变第二个轴？':'Secondary axis changed unintentionally?'}</label><input type="text" value="${esc(s.secondary_axis_changed||'')}" onchange="save('${k}','secondary_axis_changed',this.value)" placeholder="${L?'如 insight / conviction；无则留空':'e.g. insight / conviction; blank if none'}"></div>
<div class="field"><label>${L?'禁忌/不应出现的回应行为':'Contraindicated behaviors'}</label><div class="checks">${check(k,s,'contra_delusion_confirmation','Delusion confirmation')}${check(k,s,'contra_evidence_gathering','Unsafe evidence gathering')}${check(k,s,'contra_ridicule','Ridicule / confrontation')}${check(k,s,'contra_premature_label','Premature diagnostic label')}${check(k,s,'contra_under_triage','Dangerous under-triage')}${check(k,s,'contra_over_escalation','Unnecessary over-escalation')}</div></div>
<div class="field"><label>${L?'备注 / 修改建议':'Notes / revision suggestion'}</label><textarea onchange="save('${k}','free_text_notes',this.value)">${esc(s.free_text_notes||'')}</textarea></div><div class="nav"><button onclick="prev()">${T[lang].prev}</button><button onclick="next()">${T[lang].next}</button></div></div>`;updateProgress()}
function updateProgress(){const arr=filtered();let done=0;for(const it of arr){const s=state[key(it)]||{};if(s.manipulation_success&&s.acceptable_L!==undefined&&s.acceptable_U!==undefined&&s.target_direction!==undefined)done++}document.getElementById('progress').textContent=`${done}/${arr.length}`}
function prev(){idx=Math.max(0,idx-1);render();scrollTo({top:0,behavior:'smooth'})}function next(){idx=Math.min(filtered().length-1,idx+1);render();scrollTo({top:0,behavior:'smooth'})}
function exportCSV(){const reviewer=document.getElementById('reviewer').value.trim();const fields=['reviewer_id','family_id','domain','theme','axis','level','manipulation_success','major_confound','domain_fit_1_5','realism_1_5','acceptable_L','acceptable_U','target_direction','clinically_relevant_change','secondary_axis_changed','contra_delusion_confirmation','contra_evidence_gathering','contra_ridicule','contra_premature_label','contra_under_triage','contra_over_escalation','free_text_notes'];const rows=[fields];for(const it of ITEMS){const s=state[key(it)]||{};rows.push(fields.map(f=>f==='reviewer_id'?reviewer:(it[f]??s[f]??'')))}const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';const csv=rows.map(r=>r.map(q).join(',')).join('\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`PAIR_C_clinician_review_${reviewer||'reviewer'}.csv`;a.click();URL.revokeObjectURL(a.href)}
function clearAll(){const msg=lang==='zh'?'确定清空本浏览器的全部评分？':'Clear all ratings stored in this browser?';if(confirm(msg)){state={};localStorage.removeItem(KEY);render()}}
document.getElementById('familyFilter').addEventListener('change',()=>{idx=0;render()});document.getElementById('axisFilter').addEventListener('change',()=>{idx=0;render()});
(async function(){let preferred='zh';try{preferred=localStorage.getItem('pair-review-lang')||((navigator.language||'').toLowerCase().startsWith('zh')?'zh':'en')}catch(e){}setLang(preferred);try{const r=await fetch(DATA_URL,{cache:'no-store'});if(!r.ok)throw new Error(String(r.status));ITEMS=parseCSV(await r.text());const fs=[...new Set(ITEMS.map(x=>x.family_id))];document.getElementById('familyFilter').innerHTML='<option value="">All families / 全部 family</option>'+fs.map(f=>`<option>${esc(f)}</option>`).join('');render()}catch(e){document.getElementById('loadError').classList.remove('hidden');document.getElementById('loadError').textContent=T[lang].loadfail+' ('+e.message+')';document.getElementById('app').innerHTML=''}})();
</script>
</body>
</html>
