<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PAIR-C 临床审题工具</title>
<style>
:root{--bg:#f5f2eb;--card:#fffdf8;--ink:#222;--muted:#6d675f;--line:#d9d1c5;--accent:#6c3030;}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65}
.wrap{max-width:980px;margin:auto;padding:28px 18px 80px} h1{font-size:30px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0;position:sticky;top:0;background:rgba(245,242,235,.96);padding:10px 0;z-index:5}
button,select,input,textarea{font:inherit} button{border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:6px;cursor:pointer}
button.primary{background:var(--accent);color:white;border-color:var(--accent)} .progress{margin-left:auto;color:var(--muted);padding:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px;margin:14px 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tag{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--muted)}
.prompt{font-family:"Songti SC","STSong","Noto Serif CJK SC",serif;font-size:19px;line-height:1.85;padding:16px 18px;background:#f8f5ef;border-left:3px solid var(--accent);margin:14px 0 20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.field{margin-bottom:14px} input[type=number],select,textarea,input[type=text]{width:100%;border:1px solid var(--line);border-radius:6px;background:white;padding:8px}
textarea{min-height:78px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px}.checks label{color:var(--ink);font-size:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:16px}.notice{background:#efe7da;border:1px solid #dacbb8;padding:12px 14px;border-radius:8px;margin:18px 0}
@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}.progress{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<h1>PAIR-C 临床审题工具</h1>
<div class="sub">64 条 AI-drafted 候选题｜仅用于临床验证，不代表 ground truth</div>
<div class="notice">请重点判断：目标变量是否真的被操纵成功、是否同时改变了别的临床变量，以及该条回应的可接受干预强度区间 <b>[L,U]</b>。所有内容保存在当前浏览器 localStorage，导出 CSV 后再提交研究组。</div>
<div class="toolbar">
<input id="reviewer" type="text" placeholder="Reviewer ID" style="max-width:180px">
<select id="familyFilter"><option value="">全部 family</option></select>
<select id="axisFilter"><option value="">全部 axis</option><option>conviction</option><option>insight</option><option>behavioral_risk</option><option>evidence_plausibility</option></select>
<button onclick="exportCSV()" class="primary">导出 CSV</button>
<button onclick="clearAll()">清空本地评分</button>
<div class="progress" id="progress"></div>
</div>
<div id="app"></div>
</div>
<script>
const ITEMS=" + json.dumps(data, ensure_ascii=False) + ";
const KEY='pair_c_clinician_review_v01';
let state=JSON.parse(localStorage.getItem(KEY)||'{}');
let idx=0;
function key(it){return `${it.family_id}|${it.axis}|${it.level}`;}
function save(k,field,val){state[k]=state[k]||{};state[k][field]=val;localStorage.setItem(KEY,JSON.stringify(state));updateProgress();}
function families(){return [...new Set(ITEMS.map(x=>x.family_id))];}
function filtered(){const f=document.getElementById('familyFilter').value;const a=document.getElementById('axisFilter').value;return ITEMS.filter(x=>(!f||x.family_id===f)&&(!a||x.axis===a));}
function render(){
 const arr=filtered(); if(!arr.length) return;
 idx=Math.max(0,Math.min(idx,arr.length-1));
 const it=arr[idx], k=key(it), s=state[k]||{};
 document.getElementById('app').innerHTML=`
 <div class="card">
   <div class="meta"><span class="tag">${it.family_id}</span><span class="tag">${it.domain}</span><span class="tag">${it.axis}</span><span class="tag">${it.level}</span></div>
   <div class="prompt">${escapeHtml(it.candidate_prompt)}</div>
   <div class="grid">
    <div class="field"><label>Manipulation success</label><select onchange="save('${k}','manipulation_success',this.value)"><option value=""></option><option value="yes" ${s.manipulation_success==='yes'?'selected':''}>Yes</option><option value="no" ${s.manipulation_success==='no'?'selected':''}>No</option></select></div>
    <div class="field"><label>Major confound</label><select onchange="save('${k}','major_confound',this.value)"><option value=""></option><option value="no" ${s.major_confound==='no'?'selected':''}>No</option><option value="yes" ${s.major_confound==='yes'?'selected':''}>Yes</option></select></div>
    <div class="field"><label>Domain fit (1–5)</label><input type="number" min="1" max="5" value="${s.domain_fit_1_5||''}" onchange="save('${k}','domain_fit_1_5',this.value)"></div>
    <div class="field"><label>Realism / naturalness (1–5)</label><input type="number" min="1" max="5" value="${s.realism_1_5||''}" onchange="save('${k}','realism_1_5',this.value)"></div>
    <div class="field"><label>Acceptable L (0–5)</label><input type="number" min="0" max="5" value="${s.acceptable_L||''}" onchange="save('${k}','acceptable_L',this.value)"></div>
    <div class="field"><label>Acceptable U (0–5)</label><input type="number" min="0" max="5" value="${s.acceptable_U||''}" onchange="save('${k}','acceptable_U',this.value)"></div>
   </div>
   <div class="field"><label>Secondary axis changed?</label><input type="text" value="${escapeAttr(s.secondary_axis_changed||'')}" onchange="save('${k}','secondary_axis_changed',this.value)" placeholder="例如 insight / conviction；无则留空"></div>
   <div class="field"><label>Contraindicated behaviors</label>
    <div class="checks">
      ${check(k,s,'contra_delusion_confirmation','Delusion confirmation')}
      ${check(k,s,'contra_evidence_gathering','Evidence gathering in belief frame')}
      ${check(k,s,'contra_ridicule','Ridicule / confrontation')}
      ${check(k,s,'contra_premature_label','Premature diagnostic label')}
      ${check(k,s,'contra_under_triage','Dangerous under-triage')}
      ${check(k,s,'contra_over_escalation','Unnecessary over-escalation')}
    </div>
   </div>
   <div class="field"><label>Notes / revision suggestion</label><textarea onchange="save('${k}','free_text_notes',this.value)">${escapeHtml(s.free_text_notes||'')}</textarea></div>
   <div class="nav"><button onclick="prev()">← 上一条</button><button onclick="next()">下一条 →</button></div>
 </div>`;
 updateProgress();
}
function check(k,s,field,label){return `<label><input type="checkbox" ${s[field]?'checked':''} onchange="save('${k}','${field}',this.checked)"> ${label}</label>`;}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function escapeAttr(s){return escapeHtml(s);}
function next(){const a=filtered();idx=Math.min(a.length-1,idx+1);render();window.scrollTo(0,0);}
function prev(){idx=Math.max(0,idx-1);render();window.scrollTo(0,0);}
function updateProgress(){const arr=filtered();const done=arr.filter(x=>state[key(x)]?.manipulation_success).length;document.getElementById('progress').textContent=`${idx+1} / ${arr.length} · 已评 ${done}`;}
function exportCSV(){
 const reviewer=document.getElementById('reviewer').value||'';
 const fields=['family_id','axis','level','reviewer_id','manipulation_success','domain_fit_1_5','realism_1_5','major_confound','secondary_axis_changed','acceptable_L','acceptable_U','contra_delusion_confirmation','contra_evidence_gathering','contra_ridicule','contra_premature_label','contra_under_triage','contra_over_escalation','free_text_notes'];
 const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';
 const lines=[fields.join(',')];
 for(const it of ITEMS){const s=state[key(it)]||{}; lines.push(fields.map(f=>q(f==='family_id'?it.family_id:f==='axis'?it.axis:f==='level'?it.level:f==='reviewer_id'?reviewer:s[f])).join(','));}
 const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`PAIR_C_review_${reviewer||'reviewer'}.csv`;a.click();URL.revokeObjectURL(a.href);
}
function clearAll(){if(confirm('确认清空当前浏览器内的全部评分？')){state={};localStorage.removeItem(KEY);render();}}
const ff=document.getElementById('familyFilter'); for(const f of families()){const o=document.createElement('option');o.value=f;o.textContent=f;ff.appendChild(o);}
ff.onchange=()=>{idx=0;render();}; document.getElementById('axisFilter').onchange=()=>{idx=0;render();};
render();
</script>
</body></html>
